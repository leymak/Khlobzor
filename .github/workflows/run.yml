name: KHL Daily Analytics Agent

on:
  schedule:
    # 06:00 UTC = 09:00 МСК (утреннее превью и разбор плюсов/минусов)
    - cron: "0 6 * * *"
    # 20:00 UTC = 23:00 МСК (вечерние итоги и разбор ошибок)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска (auto, morning или evening)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run KHL Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python agent.py
